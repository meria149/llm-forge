[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-forge"
version = "0.0.1"
description = "Framework personnel pour maîtriser les LLM en contexte métier : appels journalisés, routage, agents, recherche, évals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["pandas>=2.2", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
